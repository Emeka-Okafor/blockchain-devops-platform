version: '3.8'

services:
  # Blockchain Node (Using Reth - modern and fast Ethereum-compatible node)
  blockchain-node:
    image: ghcr.io/paradigmxyz/reth:latest
    container_name: blockchain-node
    ports:
      - "8545:8545"      # HTTP RPC Port
      - "30303:30303"    # P2P Discovery Port
    volumes:
      - blockchain-data:/data
    command:
      - "node"
      - "--dev"
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.api=eth,web3,net,debug"
      - "--authrpc.jwtsecret=/data/jwt.hex"
    restart: unless-stopped

  # RPC Proxy with Nginx (for rate limiting and better reliability)
  rpc-proxy:
    image: nginx:alpine
    container_name: rpc-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blockchain-node
    restart: unless-stopped

volumes:
  blockchain-data:
    driver: local
